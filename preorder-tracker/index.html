<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c991e8" />
    <meta name="description" content="追蹤開售、訂金、尾款與出貨狀態的預購管理工具" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>預購追蹤器</title>

    <script>
      window.APP_VERSION = "20260326-09";
    </script>

    <link rel="manifest" href="manifest.json?v=20260326-09" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=20260326-09" />
  </head>
  <body>
    <div class="app-shell">
      <div class="top-notch"></div>
      <main id="app-main" class="screen-container" aria-live="polite">
        <section id="screen-home" class="screen active"></section>
        <section id="screen-list" class="screen"></section>
        <section id="screen-calendar" class="screen"></section>
        <section id="screen-expense" class="screen"></section>
        <section id="screen-add" class="screen"></section>
      </main>

      <button id="floating-add" class="floating-add clay-button" aria-label="新增商品">+</button>

      <nav class="bottom-nav" aria-label="主要導覽">
        <button data-screen="home" class="nav-btn active"><span>🏠</span><small>首頁</small></button>
        <button data-screen="list" class="nav-btn"><span>📦</span><small>清單</small></button>
        <button data-screen="calendar" class="nav-btn"><span>🗓️</span><small>月曆</small></button>
        <button data-screen="expense" class="nav-btn"><span>💰</span><small>花費</small></button>
        <button data-screen="add" class="nav-btn"><span>➕</span><small>新增</small></button>
      </nav>
    </div>

    <dialog id="detail-modal" class="detail-modal">
      <article id="detail-content"></article>
      <form method="dialog"><button class="clay-button">關閉</button></form>
    </dialog>

    <noscript>
      <div class="noscript-banner">此應用需要啟用 JavaScript 才能使用。</div>
    </noscript>

    <script type="module">
      import(`./app.js?v=${window.APP_VERSION}`);
    </script>
  </body>
</html>
